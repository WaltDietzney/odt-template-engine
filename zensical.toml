[project]
site_name = "ODT Template Engine"
site_description = "Developer documentation for the WaltDietzney ODT Template Engine for PHP."
site_url = "https://odt.walter-dietz.de/docs/"
repo_url = "https://github.com/WaltDietzney/odt-template-engine"
repo_name = "WaltDietzney/odt-template-engine"
edit_uri = "edit/master/docs"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Introduction" = [
    { "Overview" = "index.md" },
    { "How the Engine Works" = "concepts/how-it-works.md" },
  ] },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
    { "Creating Templates" = "getting-started/creating-templates.md" },
  ] },
  { "Template Language" = [
    { "Variables & Filters" = "template-language/variables-and-filters.md" },
    { "Conditions & Loops" = "template-language/conditions-and-loops.md" },
  ] },
  { "Rich Documents" = [
    { "RichText & Paragraphs" = "rich-documents/richtext-and-paragraphs.md" },
    { "Lists" = "rich-documents/lists.md" },
    { "Tables" = "rich-documents/tables.md" },
    { "Images" = "rich-documents/images.md" },
  ] },
  { "Styling" = [
    { "Style Model" = "styling/style-model.md" },
    { "Text & Paragraph Styles" = "styling/text-and-paragraph-styles.md" },
    { "Table & Cell Styles" = "styling/table-and-cell-styles.md" },
  ] },
  { "Examples" = [
    { "Editable CV Showcase" = "examples/cv-showcase.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
  "content.code.copy",
]
