name: Bug report
description: Report reproducible incorrect behavior in ODT Template Engine
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        ODT behavior can depend on both the PHP code and the XML generated by the office application that created the template. A small reproducible example helps enormously.

        **Security vulnerabilities must not be reported here.** Please follow `SECURITY.md` instead.

  - type: input
    id: engine-version
    attributes:
      label: ODT Template Engine version
      description: Package version, Git tag, branch or commit SHA.
      placeholder: e.g. 0.9.0, master, or a commit SHA
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. PHP 8.3.6
    validations:
      required: true

  - type: input
    id: office-version
    attributes:
      label: Office application and version
      description: Especially relevant when the issue involves template structure or rendering.
      placeholder: e.g. LibreOffice 26.x

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Variables / filters
        - Loops / conditions
        - RichText / paragraphs
        - Lists
        - Tables / table cells
        - Images
        - HTML import
        - Styles
        - Metadata
        - ODT package / XML handling
        - Sample Explorer
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What is going wrong?
      placeholder: Describe the problem as clearly as possible.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest PHP example and template structure that reproduce the problem. You may attach a minimal ODT file if needed. Remove personal or confidential data first.
      render: php
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the generated ODT document or engine to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the result. Include warnings, exceptions or relevant XML observations when available.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, XML snippets, LibreOffice observations or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested or reproduced this with a current version of the project.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: Any attached templates or examples contain no confidential or personal data.
          required: true
